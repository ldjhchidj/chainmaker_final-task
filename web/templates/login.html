{% extends 'base.html' %}
{% block content %}
<div class="login-wrap">
  <h2>用户登录</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" class="card">
    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">登录</button>
  </form>

  <div class="notice small">
    <strong>演示账号（首次启动自动写入 SQLite）</strong>
    <table class="table">
      <thead><tr><th>角色</th><th>用户名</th><th>密码</th><th>权限</th></tr></thead>
      <tbody>
        <tr><td>查询机构</td><td><code>query_org</code></td><td><code>Query@2024</code></td><td>查询、验真</td></tr>
        <tr><td>高校</td><td><code>uni_org_bupt</code></td><td><code>Uni@2024</code></td><td>颁发 + 查询</td></tr>
        <tr><td>教育部</td><td><code>edu_org_moe</code></td><td><code>Edu@2024</code></td><td>颁发 / 查询 / 撤销 / 台账</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
